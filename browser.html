<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ローカル簡易ブラウザ</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .toolbar{display:flex;gap:8px;padding:8px;background:#f0f0f0;align-items:center}
    .toolbar input[type="text"]{flex:1;padding:6px 8px;border:1px solid #ccc;border-radius:4px}
    .toolbar button{padding:6px 10px}
    #browserFrame{width:100%;height:80vh;border:1px solid #ddd}
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="backBtn">◀</button>
    <button id="forwardBtn">▶</button>
    <button id="homeBtn">🏠</button>
    <input id="urlInput" type="text" placeholder="https://example.com/" value="/index.html">
    <button id="goBtn">読み込む</button>
  </div>

  <iframe id="browserFrame" src="/index.html" sandbox="allow-same-origin allow-scripts allow-forms"></iframe>

  <script>
    const urlInput = document.getElementById('urlInput');
    const goBtn = document.getElementById('goBtn');
    const frame = document.getElementById('browserFrame');
    const backBtn = document.getElementById('backBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const homeBtn = document.getElementById('homeBtn');

    const historyStack = [];
    let historyPos = -1;

    function loadURL(url, push=true){
      frame.src = url;
      urlInput.value = url;
      if(push){
        historyStack.splice(historyPos+1);
        historyStack.push(url);
        historyPos = historyStack.length - 1;
      }
      updateButtons();
    }

    function updateButtons(){
      backBtn.disabled = historyPos <= 0;
      forwardBtn.disabled = historyPos >= historyStack.length - 1 || historyPos === -1;
    }

    goBtn.addEventListener('click', ()=> loadURL(urlInput.value));
    urlInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') loadURL(urlInput.value); });
    backBtn.addEventListener('click', ()=>{ if(historyPos>0){ historyPos--; frame.src = historyStack[historyPos]; } updateButtons(); });
    forwardBtn.addEventListener('click', ()=>{ if(historyPos < historyStack.length -1){ historyPos++; frame.src = historyStack[historyPos]; } updateButtons(); });
    homeBtn.addEventListener('click', ()=> loadURL('/index.html'));

    loadURL(urlInput.value);
  </script>
</body>
</html>
